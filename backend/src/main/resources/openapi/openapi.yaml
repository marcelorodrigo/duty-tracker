        past:
          type: array
          items:
            $ref: '#/components/schemas/CalendarFeedEventResponse'

    CalendarFeedEventResponse:
      type: object
      properties:
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        summary:
          type: string

