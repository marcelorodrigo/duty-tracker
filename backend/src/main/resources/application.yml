spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dutytracker}
    username: ${DB_USER:dutytracker}
    password: ${DB_PASSWORD:dutytracker}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  # Base URL used to build RFC 7807 problem type URIs in error responses.
  # Override this in production to match the public API URL,
  # e.g., https://api.example.com
  base-url: http://localhost:8080
  # Allowed CORS origins for the frontend. Defaults to localhost:3000 for local dev.
  # Override in production/staging, e.g. https://app.example.com,https://staging.example.com
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /openapi/openapi.yaml
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  packages-to-scan: []
  paths-to-match: []

