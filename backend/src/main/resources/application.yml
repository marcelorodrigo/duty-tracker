spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dutytracker}
    username: ${DB_USER:dutytracker}
    password: ${DB_PASSWORD:dutytracker}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  # Base URL used to build RFC 7807 problem type URIs in error responses.
  # Override this in production to match the public API URL,
  # e.g., https://api.example.com
  base-url: http://localhost:8080
  # Applied only when optional values are omitted from POST /api/v1/profile.
  profile-defaults:
    hourly-rate: ${PROFILE_DEFAULT_HOURLY_RATE:1.00}
    standby-weekday-saturday-percentage: ${PROFILE_DEFAULT_STANDBY_WEEKDAY_SATURDAY_PERCENTAGE:0.067}
    standby-weekday-sunday-holiday-percentage: ${PROFILE_DEFAULT_STANDBY_SUNDAY_HOLIDAY_PERCENTAGE:0.084}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /openapi/openapi.yaml
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  packages-to-scan: []
  paths-to-match: []
