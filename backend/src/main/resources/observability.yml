spring:
  application:
    name: duty-tracker-backend

management:
  endpoints:
    access:
      default: none
    web:
      base-path: /actuator
      exposure:
        include: health,prometheus
  endpoint:
    health:
      access: read-only
      show-components: never
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}
