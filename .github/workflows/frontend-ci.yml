name: Frontend CI

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-tags: false
          show-progress: false
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 'latest'
      
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install
      
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      
      - name: Run tests
        working-directory: frontend
        run: pnpm test
